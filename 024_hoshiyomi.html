<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#024 · 七人の星読みたち</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Antique&family=Noto+Sans+JP:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --paper: #f4efe6;
  --paper2: #ede6d8;
  --paper3: #e4dbc8;
  --ink: #2a221a;
  --ink2: #5c4f42;
  --muted: #9a8a7a;
  --rust: #b85c38;
  --rust2: #d4784f;
  --amber: #c49a3c;
  --sage: #6b7c5e;
  --indigo: #4a6fa5;
  --line: rgba(42,34,26,.12);
  --shadow: 0 4px 20px rgba(42,34,26,.10);
  --shadow2: 0 8px 32px rgba(42,34,26,.16);
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 80px;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(42,34,26,.03) 28px, rgba(42,34,26,.03) 29px);
  pointer-events:none;
  z-index:0;
}

.wrap{ max-width: 560px; margin: 0 auto; padding: 0 16px; position: relative; z-index:1; }

/* ── HEADER ── */
.app-header{
  padding: 32px 0 20px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 24px;
}
.app-label{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--rust);
  margin-bottom: 6px;
}
.app-title{
  font-family: 'Zen Antique', serif;
  font-size: 24px;
  letter-spacing: .06em;
  margin-bottom: 4px;
}
.app-sub{ font-size: 12px; color: var(--muted); }

/* ── API KEY ── */
.apikey-bar{
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 16px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.apikey-bar input{
  flex:1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink2);
}
.apikey-bar label{
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.btn-sm{
  padding: 5px 12px;
  background: var(--rust);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}
.btn-sm:hover{ background: var(--rust2); }

/* ── DATA STATUS ── */
.data-status{
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.data-status-title{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--muted);
  margin-bottom: 10px;
}
.data-row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  padding: 4px 0;
  border-bottom: 1px solid var(--line);
}
.data-row:last-child{ border-bottom: none; }
.data-row .label{ color: var(--ink2); }
.data-row .val{
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--rust);
}
.data-row .val.ok{ color: var(--sage); }
.data-row .val.warn{ color: var(--amber); }
.data-row .val.ng{ color: var(--muted); }

.char-bar{
  margin-top: 10px;
  height: 4px;
  background: var(--paper3);
  border-radius: 999px;
  overflow: hidden;
}
.char-fill{
  height: 100%;
  border-radius: 999px;
  background: var(--sage);
  transition: width .4s;
}
.char-fill.warn{ background: var(--amber); }
.char-fill.over{ background: var(--rust); }
.char-note{
  margin-top: 4px;
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

/* ── CHARACTERS ── */
.section-title{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--muted);
  margin-bottom: 12px;
}

.char-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 28px;
}

.char-card{
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 14px 14px 12px;
  cursor: pointer;
  transition: all .18s;
  position: relative;
  overflow: hidden;
}
.char-card::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background: var(--char-color, var(--rust));
}
.char-card:hover{
  border-color: var(--char-color, var(--rust));
  transform: translateY(-2px);
  box-shadow: var(--shadow2);
}
.char-card.loading{
  pointer-events: none;
  opacity: .7;
}
.char-card.done{
  border-color: var(--char-color, var(--rust));
  background: rgba(255,255,255,1);
}

.char-top{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.char-icon{ font-size: 20px; line-height:1; }
.char-info{ flex:1; }
.char-name{
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}
.char-catch{
  font-size: 10px;
  color: var(--muted);
  line-height: 1.4;
  margin-top: 1px;
}

.char-result{
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink2);
  display: none;
  margin-top: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}
.char-card.done .char-result{ display: block; }

.char-status{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
  text-align: right;
}
.char-card.loading .char-status::after{
  content: '考え中...';
  animation: blink 1s infinite;
}
@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.3} }

.char-btn-row{
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.char-ask-btn{
  flex:1;
  padding: 8px;
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 11px;
  color: var(--ink2);
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  font-family: 'Noto Sans JP', sans-serif;
}
.char-ask-btn:hover{
  background: var(--char-color, var(--rust));
  color: #fff;
  border-color: transparent;
}
.char-card.done .char-ask-btn{ font-size:10px; padding:6px; }

/* ask all button */
.btn-all{
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 10px;
  font-family: 'Zen Antique', serif;
  font-size: 15px;
  letter-spacing: .06em;
  cursor: pointer;
  margin-bottom: 20px;
  transition: all .2s;
}
.btn-all:hover{ background: var(--rust); }
.btn-all:disabled{ opacity:.4; pointer-events:none; }

/* toast */
.toast{
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--ink); color:var(--paper);
  padding:10px 20px; border-radius:999px;
  font-size:12px; opacity:0; transition:all .3s;
  z-index:100; white-space:nowrap;
}
.toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

/* back link */
.back-link{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; color:var(--muted);
  text-decoration:none; margin-bottom:20px;
  font-family:'JetBrains Mono',monospace;
}
.back-link:hover{ color:var(--rust); }
</style>
</head>
<body>
<div class="wrap">

  <a href="index.html" class="back-link">← もどる</a>

  <header class="app-header">
    <div class="app-label">#024 · HOSHIYOMI SEVEN REBOOT</div>
    <h1 class="app-title">七人の星読みたち 🔮</h1>
    <p class="app-sub">直近7日のログをもとに、それぞれの視点で診断する</p>
  </header>

  <!-- API Key -->
  <div class="apikey-bar">
    <label>API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..."/>
    <button class="btn-sm" onclick="saveKey()">保存</button>
  </div>

  <!-- Data Status -->
  <div class="data-status">
    <div class="data-status-title">DATA STATUS</div>
    <div class="data-row">
      <span class="label">📝 デイリーログ</span>
      <span class="val" id="log-status">未読込</span>
    </div>
    <div class="data-row">
      <span class="label">🛏 ガーミン睡眠データ</span>
      <span class="val" id="garmin-status">未読込</span>
    </div>
    <div class="data-row">
      <span class="label">📊 AIに送る文字数</span>
      <span class="val" id="char-status">—</span>
    </div>
    <div class="char-bar"><div class="char-fill" id="char-fill" style="width:0%"></div></div>
    <div class="char-note" id="char-note">上限4,000字を目安にしています</div>
  </div>

  <!-- Ask All -->
  <button class="btn-all" id="btn-all" onclick="askAll()" disabled>
    🔮 全員に診断してもらう
  </button>

  <!-- Characters -->
  <div class="section-title">CAST · 七人の星読みたち</div>
  <div class="char-grid" id="char-grid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── CHARACTERS ──
const CHARS = [
  {
    id: 'rururu',
    icon: '🎙',
    name: 'るるるの部屋',
    catch: '好奇心全開・独自視点',
    color: '#b85c38',
    prompt: `あなたは「るるるの部屋」の司会者です。黒柳徹子さんふうの、天真爛漫で好奇心旺盛なキャラクターです。
相手の話に「まあ！」「それはすごい！」と純粋に驚き、誰も気づかない角度から本質を突いてきます。
トーク番組の収録中という設定で、データを見てひとこと言ってください。
語尾は「〜なのよ」「〜だと思うわ」など。800字以内で。`
  },
  {
    id: 'netketsu',
    icon: '🔥',
    name: '熱血兄弟',
    catch: 'テンション全開・煽り系',
    color: '#c0392b',
    prompt: `あなたは「熱血兄弟」です。ジョン・カビラと川平慈英兄弟ふうの、テンション爆上がりアナウンサーキャラです。
スポーツ実況のように、データをドラマチックに読み上げてください。
「イェーッ！」「信じられない！」「これは！これは！」など実況口調で。兄弟の掛け合いでもOK。800字以内で。`
  },
  {
    id: 'yurumaru',
    icon: '🌸',
    name: 'ゆるまる小学生',
    catch: '脱力・でも本質つく',
    color: '#e07b8a',
    prompt: `あなたは「ゆるまる小学生」です。ちびまる子ちゃんふうの、のんびりした小学生キャラです。
難しいことはわからないけど、なんとなく正しいことを言ってしまう。
「〜だと思うんだけどなあ」「まあいいか」「なんか…ちょっとかわいそう」など脱力した口調で。800字以内で。`
  },
  {
    id: 'matsudo',
    icon: '💅',
    name: '松戸デラックス',
    catch: '毒舌・でも愛がある',
    color: '#7b5ea7',
    prompt: `あなたは「松戸デラックス」です。マツコ・デラックスさんふうの、毒舌だけど本質を愛を持って言うキャラです。
「あのねえ」「わかる？」「ハッキリ言うけど」など独特の口調で、データを見て思ったことを正直に言ってください。
毒を吐きつつも、最後は相手の味方。800字以内で。`
  },
  {
    id: 'keisuke',
    icon: '⚽',
    name: '元ミランの10番',
    catch: '自己啓発・ビッグマウス',
    color: '#2980b9',
    prompt: `あなたは「元ミランの10番」です。本田圭佑さんふうの、自己啓発系ビッグマウスキャラです。
「僕の経験上」「信じてください」「可能性は0じゃないです」など独特の言い回しで、データを見て前向きなメッセージを送ってください。
自分の話を少し混ぜながら、相手を鼓舞する。800字以内で。`
  },
  {
    id: 'yoshi',
    icon: '🍚',
    name: 'よっしー先生',
    catch: '全肯定・養生の人',
    color: '#6b7c5e',
    prompt: `あなたは「よっしー先生」です。土井善晴先生ふうの、料理研究家キャラです。
すべてを受け入れ、「それでええんです」「ほら、こうやって」と優しく包み込む。
料理や食の比喩を使いながら、データをあたたかく読み解いてください。関西弁ベースで。800字以内で。`
  },
  {
    id: 'zero',
    icon: '🔢',
    name: '落合ゼロ',
    catch: 'データ一刀両断',
    color: '#2c3e50',
    prompt: `あなたは「落合ゼロ」です。落合陽一さんふうの、デジタルネイチャー系研究者キャラです。
「数字以外は全部感情ですよ」「ノイズを除去すると」「これは事実です」などの口調で、データを淡々と分析してください。
ガーミンの数値を具体的に引用しながら、本質だけを語る。感情論は排除。800字以内で。`
  },
];

// ── INIT ──
function init(){
  // APIキー読込
  const key = localStorage.getItem('qq_api_key') || '';
  document.getElementById('api-key').value = key;

  // キャラカード描画
  renderChars();

  // データ状態確認
  checkDataStatus();
}

function saveKey(){
  const key = document.getElementById('api-key').value.trim();
  localStorage.setItem('qq_api_key', key);
  showToast('APIキーを保存しました');
}

// ── RENDER CHARS ── 
function renderChars(){
  const grid = document.getElementById('char-grid');
  grid.innerHTML = CHARS.map(c => `
    <div class="char-card" id="card-${c.id}" style="--char-color:${c.color}">
      <div class="char-top">
        <div class="char-icon">${c.icon}</div>
        <div class="char-info">
          <div class="char-name">${c.name}</div>
          <div class="char-catch">${c.catch}</div>
        </div>
      </div>
      <div class="char-btn-row">
        <button class="char-ask-btn" onclick="askOne('${c.id}')">診断してもらう</button>
      </div>
      <div class="char-result" id="result-${c.id}"></div>
      <div class="char-status" id="status-${c.id}"></div>
    </div>
  `).join('');
}

// ── DATA STATUS ──
function checkDataStatus(){
  // ログ
  const logs = getLogs();
  const logEl = document.getElementById('log-status');
  if(logs.length === 0){
    logEl.textContent = '未読込';
    logEl.className = 'val ng';
  } else {
    logEl.textContent = `直近${logs.length}件`;
    logEl.className = 'val ok';
  }

  // ガーミン
  const garmin = getGarmin();
  const garminEl = document.getElementById('garmin-status');
  if(!garmin){
    garminEl.textContent = '未読込';
    garminEl.className = 'val ng';
  } else {
    garminEl.textContent = `${garmin.latest}まで`;
    garminEl.className = 'val ok';
  }

  // 文字数
  const summary = buildSummary();
  const len = summary.length;
  const MAX = 4000;
  const pct = Math.min(len / MAX * 100, 100);
  const charEl = document.getElementById('char-status');
  const fill = document.getElementById('char-fill');
  const note = document.getElementById('char-note');

  charEl.textContent = `${len.toLocaleString()}字`;
  fill.style.width = pct + '%';

  if(len === 0){
    charEl.className = 'val ng';
    fill.className = 'char-fill';
    note.textContent = 'ログかガーミンデータを読み込んでください';
  } else if(len > MAX){
    charEl.className = 'val warn';
    fill.className = 'char-fill over';
    note.textContent = `⚠️ ${len.toLocaleString()}字 — 上限${MAX.toLocaleString()}字を超えています`;
  } else {
    charEl.className = 'val ok';
    fill.className = len > MAX * 0.8 ? 'char-fill warn' : 'char-fill';
    note.textContent = `上限${MAX.toLocaleString()}字の ${Math.round(pct)}%`;
  }

  // ボタン有効化
  document.getElementById('btn-all').disabled = len === 0;
}

// ── BUILD SUMMARY (送信データ組み立て) ──
function buildSummary(){
  const logs = getLogs(); // 直近7件
  const garmin = getGarmin();

  let text = '';

  if(logs.length > 0){
    text += '【直近デイリーログ】\n';
    logs.forEach(l => {
      text += `\n▼ ${l.date}\n`;
      if(l.ritual) text += `入眠儀式: ${l.ritual === 'yes' ? '完了' : '未完了'}\n`;
      if(l.wake) text += `目覚め: ${WAKE_JP[l.wake] || l.wake}\n`;
      if(l.gage) text += `MentalGage: ${GAGE_JP[l.gage] || l.gage}\n`;
      if(l.memo) text += `頭に残ったこと: ${l.memo}\n`;
      if(l.view) text += `俯瞰一言: ${l.view}\n`;
    });
  }

  if(garmin && garmin.rows){
    const recent = garmin.rows.slice(0, 7);
    text += '\n【直近ガーミン睡眠データ】\n';
    recent.forEach(r => {
      const parts = [];
      if(r.score && r.score !== '--') parts.push(`スコア:${r.score}`);
      if(r.hrv && r.hrv !== '--') parts.push(`HRV:${r.hrv}`);
      if(r.sleepTime && r.sleepTime !== '--') parts.push(`睡眠:${r.sleepTime}`);
      if(r.quality && r.quality !== '--') parts.push(`品質:${r.quality}`);
      if(parts.length > 0) text += `${r.date}: ${parts.join(' / ')}\n`;
    });
  }

  return text.trim();
}

const WAKE_JP = {
  answer:'答えが降りてきた', ok:'まあまあ', calm:'凪', heavy:'重い・眠い', chaos:'混乱・ざわつき'
};
const GAGE_JP = {
  flat:'⚫Flat', low:'🟠Low', neutral:'🟡Neutral', cruising:'🟢Cruising', charged:'⚡Charged'
};

// ── ASK ONE ──
async function askOne(charId){
  const key = localStorage.getItem('qq_api_key');
  if(!key){ showToast('APIキーを入力してください'); return; }

  const summary = buildSummary();
  if(!summary){ showToast('データがありません'); return; }

  const char = CHARS.find(c => c.id === charId);
  const card = document.getElementById(`card-${charId}`);
  const resultEl = document.getElementById(`result-${charId}`);
  const statusEl = document.getElementById(`status-${charId}`);

  card.classList.add('loading');
  card.classList.remove('done');
  resultEl.style.display = 'none';
  statusEl.textContent = '';

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 800,
        system: char.prompt,
        messages: [{ role: 'user', content: `以下のデータを読んで、あなたのキャラクターとして診断・コメントをお願いします。\n\n${summary}` }]
      })
    });

    const data = await res.json();
    if(data.error){ throw new Error(data.error.message); }

    const text = data.content?.[0]?.text || '（応答なし）';
    resultEl.textContent = text;
    resultEl.style.display = 'block';
    statusEl.textContent = `${text.length}字`;
    card.classList.remove('loading');
    card.classList.add('done');

  } catch(e){
    card.classList.remove('loading');
    statusEl.textContent = 'エラー: ' + e.message;
    showToast('エラーが発生しました');
  }
}

// ── ASK ALL ──
async function askAll(){
  for(const c of CHARS){
    await askOne(c.id);
    await new Promise(r => setTimeout(r, 600)); // 連打防止
  }
}

// ── DATA GETTERS ──
function getLogs(){
  try{
    const all = JSON.parse(localStorage.getItem('qq024_logs') || '[]');
    return all.slice(0, 7); // 直近7件
  } catch{ return []; }
}

function getGarmin(){
  try{
    return JSON.parse(localStorage.getItem('qq024_garmin') || 'null');
  } catch{ return null; }
}

// ── TOAST ──
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── START ──
init();
</script>
</body>
</html>
