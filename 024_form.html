<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>#024 デイリーログ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Antique&family=Noto+Sans+JP:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --paper: #f4efe6;
  --paper2: #ede6d8;
  --paper3: #e4dbc8;
  --ink: #2a221a;
  --ink2: #5c4f42;
  --muted: #9a8a7a;
  --rust: #b85c38;
  --rust2: #d4784f;
  --amber: #c49a3c;
  --sage: #6b7c5e;
  --line: rgba(42,34,26,.12);
  --line2: rgba(42,34,26,.06);
  --shadow: 0 2px 12px rgba(42,34,26,.08);
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* 背景テクスチャ */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(42,34,26,.03) 28px, rgba(42,34,26,.03) 29px);
  pointer-events:none;
  z-index:0;
}

.wrap{ max-width:520px; margin:0 auto; padding:0 16px; position:relative; z-index:1; }

/* ── HEADER ── */
.app-header{
  padding: 32px 0 20px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 28px;
}
.app-label{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--rust);
  margin-bottom: 6px;
}
.app-title{
  font-family: 'Zen Antique', serif;
  font-size: 22px;
  letter-spacing: .06em;
  color: var(--ink);
  margin-bottom: 4px;
}
.app-sub{
  font-size: 12px;
  color: var(--muted);
}

/* ── GARMIN BANNER ── */
.garmin-banner{
  background: var(--paper2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--amber);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.garmin-info{ font-size: 12px; color: var(--ink2); line-height: 1.6; }
.garmin-info strong{ color: var(--amber); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.garmin-warn{ color: var(--rust); font-size: 11px; }

.drop-zone{
  border: 1.5px dashed var(--amber);
  border-radius: 6px;
  padding: 10px 16px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  background: rgba(196,154,60,.04);
}
.drop-zone:hover{ background: rgba(196,154,60,.10); color: var(--amber); }
.drop-zone.dragover{ background: rgba(196,154,60,.15); border-style: solid; }

/* ── FORM ── */
.form-card{
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px 22px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.field{ margin-bottom: 22px; }
.field:last-child{ margin-bottom: 0; }

.field-label{
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .08em;
  color: var(--rust);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.field-label .icon{ font-size: 14px; }

/* date input */
input[type="date"]{
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper2);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
input[type="date"]:focus{ border-color: var(--rust2); }

/* toggle (はい/いいえ) */
.toggle-group{
  display: flex;
  gap: 8px;
}
.toggle-btn{
  flex: 1;
  padding: 10px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--paper2);
  color: var(--ink2);
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  font-family: 'Noto Sans JP', sans-serif;
}
.toggle-btn.active-yes{
  border-color: var(--sage);
  background: rgba(107,124,94,.12);
  color: var(--sage);
  font-weight: 500;
}
.toggle-btn.active-no{
  border-color: var(--muted);
  background: rgba(154,138,122,.10);
  color: var(--muted);
}

/* select chips (目覚め) */
.chip-group{
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.chip{
  padding: 10px 14px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: var(--paper2);
  color: var(--ink2);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.chip:hover{ border-color: var(--rust2); background: rgba(184,92,56,.05); }
.chip.selected{
  border-color: var(--rust);
  background: rgba(184,92,56,.08);
  color: var(--ink);
  font-weight: 500;
}

/* textarea */
textarea{
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper2);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color .2s;
  min-height: 80px;
}
textarea:focus{ border-color: var(--rust2); background: #fff; }
.field-hint{
  margin-top: 5px;
  font-size: 11px;
  color: var(--muted);
}

/* Mental Gage */
.gage-group{
  display: flex;
  gap: 6px;
}
.gage-btn{
  flex: 1;
  padding: 12px 4px 8px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--paper2);
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.gage-btn .gage-icon{ font-size: 18px; }
.gage-btn .gage-label{
  font-size: 9px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .04em;
}
.gage-btn:hover{ border-color: var(--rust2); }
.gage-btn.selected{ border-width: 2px; }
.gage-btn[data-val="flat"].selected{ border-color:#666; background:rgba(100,100,100,.1); }
.gage-btn[data-val="low"].selected{ border-color:#b85c38; background:rgba(184,92,56,.1); }
.gage-btn[data-val="neutral"].selected{ border-color:#c49a3c; background:rgba(196,154,60,.1); }
.gage-btn[data-val="cruising"].selected{ border-color:#6b7c5e; background:rgba(107,124,94,.1); }
.gage-btn[data-val="charged"].selected{ border-color:#4a7ab5; background:rgba(74,122,181,.1); }

/* divider */
.divider{
  border: none;
  border-top: 1px solid var(--line2);
  margin: 20px 0;
}

/* ── SUBMIT ── */
.submit-area{ margin-top: 8px; }
.btn-save{
  width: 100%;
  padding: 15px;
  background: var(--rust);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: .06em;
  transition: background .2s, transform .1s;
}
.btn-save:hover{ background: var(--rust2); }
.btn-save:active{ transform: translateY(1px); }

/* ── HISTORY ── */
.history-section{ margin-top: 32px; }
.history-title{
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--muted);
  margin-bottom: 12px;
}
.history-item{
  background: var(--paper2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--ink2);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.history-date{
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--rust);
  min-width: 72px;
  padding-top: 1px;
}
.history-body{ line-height: 1.6; }
.history-gage{ font-size: 14px; }

/* toast */
.toast{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--ink);
  color: #f4efe6;
  padding: 10px 20px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  transition: all .3s;
  z-index: 100;
  white-space: nowrap;
}
.toast.show{
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* note */
.note-line{
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 16px;
  line-height: 1.7;
}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <div class="app-label">#024 · DAILY LOG</div>
    <h1 class="app-title">デイリーログ</h1>
    <p class="app-sub">毎日の記録 — 分析は星読みたちに任せる</p>
  </header>

  <!-- Garmin Banner -->
  <div class="garmin-banner">
    <div class="garmin-info">
      🛏 睡眠データ <strong id="garmin-last">未読込</strong><br>
      <span id="garmin-range" style="color:var(--muted);font-size:11px;">CSVをドロップして更新</span>
    </div>
    <div>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-input').click()">
        📂 CSVをドロップ
      </div>
      <input type="file" id="csv-input" accept=".csv" style="display:none"/>
    </div>
  </div>

  <!-- Form -->
  <div class="form-card">

    <!-- 1. 日付 -->
    <div class="field">
      <div class="field-label"><span class="icon">📅</span>登録対象日</div>
      <input type="date" id="f-date"/>
    </div>

    <hr class="divider"/>

    <!-- 2. 22時儀式 -->
    <div class="field">
      <div class="field-label"><span class="icon">🌙</span>22時入眠儀式 完了</div>
      <div class="toggle-group">
        <button class="toggle-btn" data-val="yes" onclick="selectToggle(this,'ritual')">✅ できた</button>
        <button class="toggle-btn" data-val="no"  onclick="selectToggle(this,'ritual')">😪 できなかった</button>
      </div>
    </div>

    <hr class="divider"/>

    <!-- 3. 目覚め -->
    <div class="field">
      <div class="field-label"><span class="icon">🌅</span>目覚めの状態</div>
      <div class="chip-group">
        <div class="chip" data-val="answer" onclick="selectChip(this,'wake')">🧙 昨日の問いへの答えが降りてきた</div>
        <div class="chip" data-val="ok"     onclick="selectChip(this,'wake')">🐔 まあまあ、悪くない</div>
        <div class="chip" data-val="calm"   onclick="selectChip(this,'wake')">😶 凪、特になし</div>
        <div class="chip" data-val="heavy"  onclick="selectChip(this,'wake')">😪 重い、眠い</div>
        <div class="chip" data-val="chaos"  onclick="selectChip(this,'wake')">🌀 混乱・ざわつき</div>
      </div>
    </div>

    <hr class="divider"/>

    <!-- 4. 頭に残ってること -->
    <div class="field">
      <div class="field-label"><span class="icon">💭</span>今日いちばん頭に残ってること</div>
      <textarea id="f-memo" placeholder="出来事・気になること・引っかかりなど" rows="3"></textarea>
      <div class="field-hint">もっと書きたい日はノートへ — ここは分析用の核だけ</div>
    </div>

    <hr class="divider"/>

    <!-- 5. 俯瞰一言 -->
    <div class="field">
      <div class="field-label"><span class="icon">✎</span>俯瞰一言</div>
      <textarea id="f-view" placeholder="今日の自分を一言で" rows="2"></textarea>
    </div>

    <hr class="divider"/>

    <!-- 6. Mental Gage -->
    <div class="field">
      <div class="field-label"><span class="icon">⚡</span>Mental Gage</div>
      <div class="gage-group">
        <button class="gage-btn" data-val="flat"     onclick="selectGage(this)">
          <span class="gage-icon">⚫</span>
          <span class="gage-label">Flat</span>
        </button>
        <button class="gage-btn" data-val="low"      onclick="selectGage(this)">
          <span class="gage-icon">🟠</span>
          <span class="gage-label">Low</span>
        </button>
        <button class="gage-btn" data-val="neutral"  onclick="selectGage(this)">
          <span class="gage-icon">🟡</span>
          <span class="gage-label">Neutral</span>
        </button>
        <button class="gage-btn" data-val="cruising" onclick="selectGage(this)">
          <span class="gage-icon">🟢</span>
          <span class="gage-label">Cruising</span>
        </button>
        <button class="gage-btn" data-val="charged"  onclick="selectGage(this)">
          <span class="gage-icon">⚡</span>
          <span class="gage-label">Charged</span>
        </button>
      </div>
    </div>

  </div><!-- /form-card -->

  <div class="submit-area">
    <button class="btn-save" onclick="saveEntry()">この日を記録する</button>
  </div>

  <p class="note-line">データはこのブラウザに保存されます<br>星読みたちへの連携は週次で</p>

  <!-- History -->
  <div class="history-section">
    <div class="history-title">RECENT LOG</div>
    <div id="history-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
const state = {
  ritual: null,
  wake: null,
  gage: null,
};

const WAKE_LABELS = {
  answer:'🧙 答えが降りてきた', ok:'🐔 まあまあ', calm:'😶 凪',
  heavy:'😪 重い', chaos:'🌀 ざわつき'
};
const GAGE_ICONS = { flat:'⚫', low:'🟠', neutral:'🟡', cruising:'🟢', charged:'⚡' };

// ── 初期値：今日の日付 ──
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

// ── TOGGLE ──
function selectToggle(el, key){
  document.querySelectorAll('.toggle-btn').forEach(b=>{
    b.classList.remove('active-yes','active-no');
  });
  const val = el.dataset.val;
  el.classList.add(val === 'yes' ? 'active-yes' : 'active-no');
  state[key] = val;
}

// ── CHIP ──
function selectChip(el, key){
  el.closest('.chip-group').querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  state[key] = el.dataset.val;
}

// ── GAGE ──
function selectGage(el){
  document.querySelectorAll('.gage-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  state.gage = el.dataset.val;
}

// ── SAVE ──
function saveEntry(){
  const date = document.getElementById('f-date').value;
  const memo = document.getElementById('f-memo').value.trim();
  const view = document.getElementById('f-view').value.trim();

  if(!date){ showToast('日付を選んでください'); return; }
  if(!state.gage){ showToast('Mental Gageを選んでください'); return; }

  const entry = {
    date,
    ritual: state.ritual,
    wake: state.wake,
    memo,
    view,
    gage: state.gage,
    savedAt: new Date().toISOString(),
  };

  const logs = getLogs();
  // 同日があれば上書き
  const idx = logs.findIndex(l => l.date === date);
  if(idx >= 0) logs[idx] = entry; else logs.unshift(entry);
  logs.sort((a,b) => b.date.localeCompare(a.date));
  localStorage.setItem('qq024_logs', JSON.stringify(logs));

  showToast('✓ 記録しました');
  renderHistory();
  resetForm();
}

function getLogs(){
  try{ return JSON.parse(localStorage.getItem('qq024_logs') || '[]'); }
  catch{ return []; }
}

function resetForm(){
  document.getElementById('f-memo').value = '';
  document.getElementById('f-view').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active-yes','active-no'));
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  document.querySelectorAll('.gage-btn').forEach(b=>b.classList.remove('selected'));
  state.ritual = null; state.wake = null; state.gage = null;
}

// ── HISTORY ──
function renderHistory(){
  const logs = getLogs().slice(0,7);
  const el = document.getElementById('history-list');
  if(!logs.length){ el.innerHTML = '<div style="font-size:12px;color:var(--muted);text-align:center;padding:16px;">まだ記録がありません</div>'; return; }
  el.innerHTML = logs.map(l => `
    <div class="history-item">
      <div class="history-date">${l.date}</div>
      <div class="history-body">
        <span class="history-gage">${GAGE_ICONS[l.gage]||''}</span>
        ${l.wake ? ' ' + WAKE_LABELS[l.wake] : ''}
        ${l.memo ? `<br><span style="color:var(--ink2)">${l.memo.slice(0,40)}${l.memo.length>40?'…':''}</span>` : ''}
        ${l.view ? `<br><span style="color:var(--muted);font-size:11px;">✎ ${l.view.slice(0,30)}${l.view.length>30?'…':''}</span>` : ''}
      </div>
    </div>
  `).join('');
}

// ── TOAST ──
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ── GARMIN CSV ──
function parseGarminCSV(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const header = lines[0].replace(/^\uFEFF/,'').split(',');
  const dateIdx = header.findIndex(h=>h.includes('日付')||h.includes('date'));
  const scoreIdx = header.findIndex(h=>h.includes('スコア')||h.includes('score'));

  const rows = lines.slice(1).map(l=>{
    const cols = l.split(',');
    return { date: cols[dateIdx]||'', score: cols[scoreIdx]||'' };
  }).filter(r=>r.date && r.score && r.score !== '--');

  if(!rows.length) return null;

  rows.sort((a,b)=>b.date.localeCompare(a.date));
  const latest = rows[0].date;
  const oldest = rows[rows.length-1].date;

  // localStorageに保存
  localStorage.setItem('qq024_garmin', JSON.stringify({ rows, latest, oldest, loadedAt: new Date().toISOString() }));
  return { latest, oldest, count: rows.length };
}

function loadGarminState(){
  try{
    const g = JSON.parse(localStorage.getItem('qq024_garmin')||'null');
    if(!g) return;
    const days = Math.floor((Date.now()-new Date(g.loadedAt))/(1000*60*60*24));
    document.getElementById('garmin-last').textContent = g.latest;
    document.getElementById('garmin-range').textContent =
      `${g.oldest} 〜 ${g.latest}（${g.count}日分）`;
    if(days >= 5){
      document.getElementById('garmin-range').innerHTML +=
        ' <span class="garmin-warn">⚠️ ' + days + '日経過 — 更新を</span>';
    }
  }catch{}
}

// ドロップ＆クリック
const dz = document.getElementById('drop-zone');
const fi = document.getElementById('csv-input');

dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if(file) readCSV(file);
});
fi.addEventListener('change', e=>{ if(e.target.files[0]) readCSV(e.target.files[0]); });

function readCSV(file){
  const reader = new FileReader();
  reader.onload = e=>{
    const result = parseGarminCSV(e.target.result);
    if(result){
      loadGarminState();
      showToast(`✓ ${result.count}日分の睡眠データを読込みました`);
    } else {
      showToast('CSVの形式を確認してください');
    }
  };
  reader.readAsText(file, 'utf-8');
}

// ── INIT ──
loadGarminState();
renderHistory();
</script>
</body>
</html>
